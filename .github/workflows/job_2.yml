# Generated from jobs.yml by tools/manifest.py. Edit jobs.yml and re-run it; don't edit this file.
# Every-4-hours jobs.

name: job_2

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *' # every 4 hours (00-04, 04-08, ... UTC); tries hourly at :17, 4 times per block

# Attempts queue behind a running one rather than overlap, so its record is
# saved before the next attempt checks what this period still needs.
concurrency:
  group: job_2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # normally under a minute; a hang can't overlap the next run
    steps:

      - name: checkout repo content
        uses: actions/checkout@v5

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip' # reuse downloaded packages between runs

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Scheduled attempts skip scripts that already succeeded this period
      # (see tools/run_log.py); manual runs run everything.
      - name: check earlier runs this period
        id: gate
        timeout-minutes: 3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python tools/run_log.py gate

      # Each script runs in its own step, so one failing or hung script doesn't skip
      # the rest; the run is still marked failed if any step fails. Each step gets
      # only the secrets its script needs.

      - name: run mormon-reddit-comments
        id: mormon-reddit-comments
        if: ${{ !cancelled() && !contains(steps.gate.outputs.done, ',mormon-reddit-comments,') }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PRAW_CLIENT_ID: ${{ secrets.PRAW_CLIENT_ID }}
          PRAW_CLIENT_SECRET: ${{ secrets.PRAW_CLIENT_SECRET }}
          PRAW_USER_AGENT: ${{ secrets.PRAW_USER_AGENT }}
          PRAW_USERNAME: ${{ secrets.PRAW_USERNAME }}
          PRAW_PASSWORD: ${{ secrets.PRAW_PASSWORD }}
        run: python jobs/mormon-reddit-comments.py

      - name: record this run
        if: ${{ always() }}
        timeout-minutes: 3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          STEPS: ${{ toJSON(steps) }}
        run: python tools/run_log.py record
