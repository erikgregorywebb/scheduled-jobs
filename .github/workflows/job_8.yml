# Generated from jobs.yml by tools/manifest.py. Edit jobs.yml and re-run it; don't edit this file.
# Daily freshness check of every job's S3 output, after the overnight daily jobs finish, and a summary of every workflow's runs.

name: job_8

on:
  workflow_dispatch:
  schedule:
    - cron: '47 11,14,17,20,23 * * *' # daily; tries at 11:47 UTC (~3 hours after the overnight dailies), then every 3 hours until 23:47

# Attempts queue behind a running one rather than overlap, so its record is
# saved before the next attempt checks what this period still needs.
concurrency:
  group: job_8
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:

      - name: checkout repo content
        uses: actions/checkout@v5

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip' # reuse downloaded packages between runs

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Scheduled attempts skip scripts that already succeeded this period
      # (see tools/run_log.py); manual runs run everything.
      - name: check earlier runs this period
        id: gate
        timeout-minutes: 3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python tools/run_log.py gate

      # Each script runs in its own step, so one failing or hung script doesn't skip
      # the rest; the run is still marked failed if any step fails. Each step gets
      # only the secrets its script needs.

      - name: run freshness-check
        id: freshness-check
        if: ${{ !cancelled() && !contains(steps.gate.outputs.done, ',freshness-check,') }}
        timeout-minutes: 5
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/freshness-check.py

      - name: run run-summary
        id: run-summary
        if: ${{ !cancelled() && !contains(steps.gate.outputs.done, ',run-summary,') }}
        timeout-minutes: 5
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/run-summary.py

      - name: record this run
        if: ${{ always() }}
        timeout-minutes: 3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          STEPS: ${{ toJSON(steps) }}
        run: python tools/run_log.py record
