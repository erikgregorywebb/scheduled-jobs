# tutorial: https://www.rforseo.com/ressources/launch-an-r-script-using-github-actions

name: job_test_r

on:
  workflow_dispatch: # manual runs only, from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Load repo and install R
    steps:
    - uses: actions/checkout@v5
    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true # install prebuilt Linux binaries from Posit's package manager

    # Set up R packages (cached between runs)
    - name: install packages
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          any::tidyverse
          any::rvest
          any::aws.s3
          any::httr
          any::jsonlite
    
    # Run script
    - name: run scripts
      env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
      run: |
        echo "No R script under test. Replace this line with: Rscript jobs/<script>.r"
