        run: python jobs/wikipedia-daily-metrics.py

      - name: run go-fund-me
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/go-fund-me.py

      - name: run ny-lottery-winning-numbers
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/ny-lottery-winning-numbers.py

      - name: run treasury-daily
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/treasury-daily.py

      - name: run tmdb-now-playing
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python jobs/tmdb-now-playing.py

      - name: run lds-meetinghouses
        if: ${{ !cancelled() }}
        timeout-minutes: 20 # one ~60-second, ~16 MB request; room for retries
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/lds-meetinghouses.py

      - name: run lds-temples
        if: ${{ !cancelled() }}
        timeout-minutes: 20 # ~385 details pages, 4 at a time; room for retries
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/lds-temples.py

      - name: run faa-aircraft-registry
        if: ${{ !cancelled() }}
        timeout-minutes: 15 # one ~73 MB download and upload; room for retries
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/faa-aircraft-registry.py

      - name: run cnn-fear-greed
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/cnn-fear-greed.py

      - name: run lds-newsroom-rss
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/lds-newsroom-rss.py

      - name: run aaa-gas-prices
        if: ${{ !cancelled() }}
        timeout-minutes: 40 # ~103 requests at robots.txt's 10-second crawl delay is ~17 minutes; room for retries
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/aaa-gas-prices.py

      - name: run netflix-top-10
        if: ${{ !cancelled() }}
        timeout-minutes: 10 # ~35 MB of downloads when Netflix has a new weekly release; a few seconds otherwise
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/netflix-top-10.py

      - name: run billboard-hot-100
        if: ${{ !cancelled() }}
        timeout-minutes: 10 # one ~3 MB page; saves only when Billboard publishes a new weekly chart
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/billboard-hot-100.py
