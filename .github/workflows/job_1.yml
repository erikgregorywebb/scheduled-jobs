# Generated from jobs.yml by tools/manifest.py. Edit jobs.yml and re-run it; don't edit this file.
# Daily jobs.

name: job_1

on:
  workflow_dispatch:
  schedule:
    - cron: '13 8 * * *' # daily at 08:13 UTC (off the top of the hour, when GitHub queues are busiest)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # a full run normally takes ~2 minutes
    steps:

      - name: checkout repo content
        uses: actions/checkout@v5

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip' # reuse downloaded packages between runs

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Each script runs in its own step, so one failing or hung script doesn't skip
      # the rest; the run is still marked failed if any step fails. Each step gets
      # only the secrets its script needs.

      - name: run apple-app-store
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/apple-app-store.py

      - name: run apple-app-store-charts
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/apple-app-store-charts.py

      - name: run apple-podcast-charts
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/apple-podcast-charts.py

      - name: run freddie-mac-rates
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/freddie-mac-rates.py

      - name: run newsapi-top-headlines
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python jobs/newsapi-top-headlines.py

      - name: run spotify-podcast-charts
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/spotify-podcast-charts.py

      - name: run kworb-scrape
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/kworb-scrape.py

      - name: run last-fm-history
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          LAST_FM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
        run: python jobs/last-fm-history.py

      - name: run nyc-311-requests
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          NYC_OPEN_DATA_APP_TOKEN: ${{ secrets.NYC_OPEN_DATA_APP_TOKEN }}
        run: python jobs/nyc-311-requests.py

      - name: run nyc-restaurant-grades
        if: ${{ !cancelled() }}
        timeout-minutes: 10 # ~1 minute, a handful of paged Socrata queries
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          NYC_OPEN_DATA_APP_TOKEN: ${{ secrets.NYC_OPEN_DATA_APP_TOKEN }}
        run: python jobs/nyc-restaurant-grades.py

      - name: run s3-snapshots
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/s3-snapshots.py

      - name: run mormon-reddit-submissions
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PRAW_CLIENT_ID: ${{ secrets.PRAW_CLIENT_ID }}
          PRAW_CLIENT_SECRET: ${{ secrets.PRAW_CLIENT_SECRET }}
          PRAW_USER_AGENT: ${{ secrets.PRAW_USER_AGENT }}
          PRAW_USERNAME: ${{ secrets.PRAW_USERNAME }}
          PRAW_PASSWORD: ${{ secrets.PRAW_PASSWORD }}
        run: python jobs/mormon-reddit-submissions.py

      - name: run wikipedia-daily-metrics
