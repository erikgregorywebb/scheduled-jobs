# tutorial: https://www.rforseo.com/ressources/launch-an-r-script-using-github-actions

name: job_3

on:
  workflow_dispatch:
  schedule:
    - cron: '29 8 * * *' # runs daily at 08:29 UTC (off the top of the hour, staggered after job_1)

jobs:
  build:
    runs-on: ubuntu-latest

    # Load repo and install R
    steps:
    - uses: actions/checkout@v4
    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true # install prebuilt Linux binaries from Posit's package manager

    # Set up R packages (cached between runs)
    - name: install packages
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          any::tidyverse
          any::rvest
          any::aws.s3
          any::httr
          any::jsonlite
    
    # Run script
    - name: run scripts
      env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
      run: |
        Rscript jobs/zillow-scrape.r
        Rscript jobs/tsa-passenger-volumes.r
        Rscript jobs/mta-lift-status.r
        Rscript jobs/nyrr-races.r
        Rscript jobs/ksl-rentals.r
        Rscript jobs/hacker-news.r
        Rscript jobs/travel-advisories.r
