# tutorial: https://www.rforseo.com/ressources/launch-an-r-script-using-github-actions

name: job_3

on:
  workflow_dispatch:
  schedule:
    - cron: '29 8 * * *' # runs daily at 08:29 UTC (off the top of the hour, staggered after job_1)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # a run normally takes 4-6 minutes

    # Load repo and install R
    steps:
    - uses: actions/checkout@v5
    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true # install prebuilt Linux binaries from Posit's package manager

    # Set up R packages (cached between runs)
    - name: install packages
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          any::tidyverse
          any::rvest
          any::aws.s3
          any::httr
          any::jsonlite
    
    # Run each script in its own step, so one failing script doesn't skip the rest.
    # The run is still marked failed if any step fails.
    - name: run zillow-scrape
      if: ${{ !cancelled() }}
      timeout-minutes: 10
      env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: Rscript jobs/zillow-scrape.r

    - name: run tsa-passenger-volumes
      if: ${{ !cancelled() }}
      timeout-minutes: 10
      env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: Rscript jobs/tsa-passenger-volumes.r

    - name: run mta-lift-status
      if: ${{ !cancelled() }}
      timeout-minutes: 10
      env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: Rscript jobs/mta-lift-status.r

    - name: run nyrr-races
      if: ${{ !cancelled() }}
      timeout-minutes: 10
      env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: Rscript jobs/nyrr-races.r

    - name: run ksl-rentals
      if: ${{ !cancelled() }}
      timeout-minutes: 10
      env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: Rscript jobs/ksl-rentals.r

    - name: run hacker-news
      if: ${{ !cancelled() }}
      timeout-minutes: 10
      env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: Rscript jobs/hacker-news.r

    - name: run travel-advisories
      if: ${{ !cancelled() }}
      timeout-minutes: 10
      env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: Rscript jobs/travel-advisories.r
