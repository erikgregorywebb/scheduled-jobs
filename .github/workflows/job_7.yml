# Generated from jobs.yml by tools/manifest.py. Edit jobs.yml and re-run it; don't edit this file.
# Daily Ski Utah snow reports. Utah resorts post their morning reports between about 5 and 7 am Mountain time, which none of the overnight workflows run after.

name: job_7

on:
  workflow_dispatch:
  schedule:
    - cron: '37 14 * * *' # daily at 14:37 UTC (7:37 am MST / 8:37 am MDT)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - name: checkout repo content
        uses: actions/checkout@v5

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip' # reuse downloaded packages between runs

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Each script runs in its own step, so one failing or hung script doesn't skip
      # the rest; the run is still marked failed if any step fails. Each step gets
      # only the secrets its script needs.

      - name: run ski-utah-snow-reports
        if: ${{ !cancelled() }}
        timeout-minutes: 10 # a run normally takes about a minute
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/ski-utah-snow-reports.py
