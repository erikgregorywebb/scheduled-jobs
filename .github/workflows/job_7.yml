name: job_7

on:
  workflow_dispatch:
  schedule:
    # Utah resorts post their morning snow reports between about 5 and 7 am Mountain time,
    # so this runs after them, which none of the overnight jobs (job_1, 3, 4, 6) do
    - cron: '37 14 * * *' # runs daily at 14:37 UTC (7:37 am MST / 8:37 am MDT)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - name: checkout repo content
        uses: actions/checkout@v5 # checkout the repository content to github runner

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10' # install the python version needed

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: run ski-utah-snow-reports
        timeout-minutes: 10 # a run normally takes about a minute
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/ski-utah-snow-reports.py
