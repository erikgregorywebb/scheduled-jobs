name: job_test_python

on:
  workflow_dispatch: # manual runs only, from the Actions tab
    inputs:
      scripts:
        description: 'Space-separated scripts in jobs/ to run, e.g. "last-fm-history.py ny-lottery-winning-numbers.py"'
        required: true
        default: 'wikipedia-daily-metrics.py'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout repo content
        uses: actions/checkout@v5 # checkout the repository content to github runner

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10' # install the python version needed
          
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: execute py scripts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          PRAW_CLIENT_ID: ${{ secrets.PRAW_CLIENT_ID }}
          PRAW_CLIENT_SECRET: ${{ secrets.PRAW_CLIENT_SECRET }}
          PRAW_USER_AGENT: ${{ secrets.PRAW_USER_AGENT }}
          PRAW_USERNAME: ${{ secrets.PRAW_USERNAME }}
          PRAW_PASSWORD: ${{ secrets.PRAW_PASSWORD }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          LAST_FM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
          NYC_OPEN_DATA_APP_TOKEN: ${{ secrets.NYC_OPEN_DATA_APP_TOKEN }}
          SCRIPTS: ${{ inputs.scripts }} # passed via env, not inlined into the shell

        run: |
          set -e
          for script in $SCRIPTS; do
            case "$script" in
              */*|..*) echo "Expected a file name in jobs/, got: $script"; exit 1 ;;
            esac
            echo "::group::$script"
            python "jobs/$script"
            echo "::endgroup::"
          done
