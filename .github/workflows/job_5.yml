# Generated from jobs.yml by tools/manifest.py. Edit jobs.yml and re-run it; don't edit this file.
# Hourly jobs.

name: job_5

on:
  workflow_dispatch:
  schedule:
    - cron: '11,31,51 * * * *' # hourly; tries at :11, :31 and :51, away from the busy top of the hour

# Attempts queue behind a running one rather than overlap, so its record is
# saved before the next attempt checks what this period still needs.
concurrency:
  group: job_5
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:

      - name: checkout repo content
        uses: actions/checkout@v5

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip' # reuse downloaded packages between runs

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Scheduled attempts skip scripts that already succeeded this period
      # (see tools/run_log.py); manual runs run everything.
      - name: check earlier runs this period
        id: gate
        timeout-minutes: 3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python tools/run_log.py gate

      # Each script runs in its own step, so one failing or hung script doesn't skip
      # the rest; the run is still marked failed if any step fails. Each step gets
      # only the secrets its script needs.

      - name: run open-meteo-weather-hourly
        id: open-meteo-weather-hourly
        if: ${{ !cancelled() && !contains(steps.gate.outputs.done, ',open-meteo-weather-hourly,') }}
        timeout-minutes: 4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/open-meteo-weather-hourly.py

      - name: run citibike-station-status
        id: citibike-station-status
        if: ${{ !cancelled() && !contains(steps.gate.outputs.done, ',citibike-station-status,') }}
        timeout-minutes: 4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/citibike-station-status.py

      - name: run faa-airport-status
        id: faa-airport-status
        if: ${{ !cancelled() && !contains(steps.gate.outputs.done, ',faa-airport-status,') }}
        timeout-minutes: 4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/faa-airport-status.py

      - name: run metro-north-trip-updates
        id: metro-north-trip-updates
        if: ${{ !cancelled() && !contains(steps.gate.outputs.done, ',metro-north-trip-updates,') }}
        timeout-minutes: 4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/metro-north-trip-updates.py

      - name: run metro-north-service-alerts
        id: metro-north-service-alerts
        if: ${{ !cancelled() && !contains(steps.gate.outputs.done, ',metro-north-service-alerts,') }}
        timeout-minutes: 4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/metro-north-service-alerts.py

      - name: run polymarket-markets
        id: polymarket-markets
        if: ${{ !cancelled() && !contains(steps.gate.outputs.done, ',polymarket-markets,') }}
        timeout-minutes: 4 # ~60 requests, normally ~30 seconds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/polymarket-markets.py

      - name: run nyc-subway-train-positions
        id: nyc-subway-train-positions
        if: ${{ !cancelled() && !contains(steps.gate.outputs.done, ',nyc-subway-train-positions,') }}
        timeout-minutes: 4 # 8 small feeds plus a ~6 MB static zip, normally ~15 seconds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python jobs/nyc-subway-train-positions.py

      - name: record this run
        if: ${{ always() }}
        timeout-minutes: 3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          STEPS: ${{ toJSON(steps) }}
        run: python tools/run_log.py record
