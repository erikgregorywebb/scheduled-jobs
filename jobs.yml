    outputs:
      - mormon-reddit/mormon-reddit-submissions-
    description: "Grabs the latest 250 posts across the [\"mormon\"](https://www.reddit.com/r/mormon/) subreddits, dumps to S3."

  wikipedia-daily-metrics:
    script: wikipedia-daily-metrics.py
    workflow: job_1
    frequency: Daily
    timeout: 10
    outputs:
      - wikipedia/daily-metrics/wikipedia-daily-metrics-
    description: "Collects the previous day's most-viewed Wikipedia articles from the [Wikimedia pageviews API](https://wikimedia.org/api/rest_v1/), dumps to S3."

  go-fund-me:
    script: go-fund-me.py
    workflow: job_1
    frequency: Daily
    timeout: 10
    outputs:
      - go-fund-me/go-fund-me-
    description: "Collects stats for the first three featured fundraisers on [GoFundMe](https://www.gofundme.com/discover)'s discover page, dumps to S3."

  ny-lottery-winning-numbers:
