    frequency: Daily
    timeout: 10
    timeout_note: 10 pages, 15 seconds apart
    outputs:
      - hacker-news/hacker-news-
    description: "Scrapes the first ten pages of YC's [Hacker News](https://news.ycombinator.com/news?p=1), dumps to S3."

  travel-advisories:
    script: travel-advisories.py
