    workflow: job_1
    frequency: Daily
    timeout: 10
    outputs:
      - ny-lottery/ny-lottery-draws-
      - ny-lottery/ny-lottery-prizes-
    description: "Collects the latest draws, winning numbers, and NY prize/winner counts for each draw game from the [NY Lottery](https://nylottery.ny.gov/all-winning-numbers), dumps to S3."

  treasury-daily:
    script: treasury-daily.py
    workflow: job_1
    frequency: Daily
    timeout: 10
    outputs:
      - treasury/treasury-par-yield-curve-
      - treasury/treasury-bill-rates-
      - treasury/treasury-long-term-rates-
      - treasury/treasury-real-yield-curve-
      - treasury/treasury-auctions-recent-
      - treasury/treasury-auctions-upcoming-
      - stem: treasury/treasury-debt-to-penny-
        max_age_hours: 168
        note: Fiscal Data is optional in the script; its API has had multi-day outages
      - stem: treasury/treasury-cash-balance-
        max_age_hours: 168
        note: as above
    description: "Collects US Treasury yield curves, auction results and upcoming auctions, Debt to the Penny, and the daily cash balance from [home.treasury.gov](https://home.treasury.gov/resource-center/data-chart-center/interest-rates), [TreasuryDirect](https://www.treasurydirect.gov/), and [Fiscal Data](https://fiscaldata.treasury.gov/), dumps to S3."

  tmdb-now-playing:
    script: tmdb-now-playing.py
    workflow: job_1
    frequency: Daily
    timeout: 10
    secrets: [TMDB_API_KEY]
    outputs:
      - tmdb-now-playing/tmdb-now-playing-
    description: "Collects the movies currently in US theaters from [TMDB](https://developer.themoviedb.org/reference/movie-now-playing-list)'s now playing endpoint, dumps to S3."

  lds-meetinghouses:
    script: lds-meetinghouses.py
    workflow: job_1
    frequency: Daily
    timeout: 20
    timeout_note: one ~60-second, ~16 MB request; room for retries
    outputs:
      - lds-meetinghouses/v3/meetinghouses-
      - lds-meetinghouses/v3/associations-
    description: "Collects every [LDS meetinghouse](https://maps.churchofjesuschrist.org/) worldwide (~19,800) with address, coordinates and hours, plus the wards, stakes and other units that meet in each, dumps to S3."

  lds-temples:
    script: lds-temples.py
    workflow: job_1
    frequency: Daily
    timeout: 20
    timeout_note: ~385 details pages, 4 at a time; room for retries
    outputs:
      - lds-temples/temples-
      - lds-temples/milestones-
      - lds-temples/closures-
    description: "Collects every [LDS temple](https://www.churchofjesuschrist.org/temples/list) (~385) with its status (operating, renovation, opening soon, construction, announced), plus address, coordinates and hours from the Meetinghouse Locator, milestone dates (announced, groundbreaking, dedicated) from each details page, and upcoming closures, dumps to S3."

  faa-aircraft-registry:
    script: faa-aircraft-registry.py
    workflow: job_1
    frequency: Daily
    timeout: 15
    timeout_note: one ~73 MB download and upload; room for retries
    outputs:
      - stem: faa-aircraft-registry/faa-aircraft-registry-
        max_age_hours: 240
        min_size_ratio: 0.8
        note: only saved when the FAA publishes a new release
    description: "Saves the FAA's full [aircraft registry database](https://www.faa.gov/licenses_certificates/aircraft_certification/aircraft_registry/releasable_aircraft_download) zip (every US-registered aircraft, owner, and deregistration) whenever the FAA publishes a new release, dumps to S3."

  cnn-fear-greed:
    script: cnn-fear-greed.py
    workflow: job_1
    frequency: Daily
    timeout: 10
    outputs:
      - cnn-fear-greed/cnn-fear-greed-summary-
      - cnn-fear-greed/cnn-fear-greed-history-
    description: "Snapshots the [CNN Fear & Greed Index](https://www.cnn.com/markets/fear-and-greed) from the JSON endpoint behind the page: the headline score and rating (with previous close, 1-week, 1-month and 1-year comparisons), its seven component indicators, and about a year of daily history for each, dumps to S3."

  lds-newsroom-rss:
    script: lds-newsroom-rss.py
    workflow: job_1
    frequency: Daily
    timeout: 10
    outputs:
      - lds-newsroom/lds-newsroom-rss-
    description: "Collects the 25 latest press releases and announcements from the [Church Newsroom](https://newsroom.churchofjesuschrist.org/)'s official [RSS feed](https://newsroom.churchofjesuschrist.org/rss), with title, link, publish date, dateline, summary and image, dumps to S3."


  aaa-gas-prices:
    script: aaa-gas-prices.py
    workflow: job_1
    frequency: Daily
    timeout: 40
    timeout_note: ~103 requests at robots.txt's 10-second crawl delay is ~17 minutes; room for retries
    outputs:
      - aaa-gas-prices/averages/aaa-gas-prices-averages-
      - aaa-gas-prices/counties/aaa-gas-prices-counties-
      - aaa-gas-prices/records/aaa-gas-prices-records-
    description: "Collects [AAA](https://gasprices.aaa.com/)'s national, state (50 + DC), metro-area, and county gas price averages by grade (current, yesterday, week, month and year ago), plus record highs, dumps to S3 under `aaa-gas-prices/`."

  netflix-top-10:
    script: netflix-top-10.py
    workflow: job_1
    frequency: Daily
    timeout: 10
    timeout_note: ~35 MB of downloads when Netflix has a new weekly release; a few seconds otherwise
    outputs:
      - stem: netflix-top-10/all-weeks-global/netflix-top-10-all-weeks-global-
        max_age_hours: 216
        note: only saved when Netflix publishes a new week, on Tuesdays
      - stem: netflix-top-10/united-states/netflix-top-10-united-states-
        max_age_hours: 216
        note: only saved when Netflix publishes a new week, on Tuesdays
      - stem: netflix-top-10/most-popular/netflix-top-10-most-popular-
        max_age_hours: 1080
        note: only saved when the all-time list changes, which can be weeks apart
    description: "Saves Netflix's official [Top 10](https://www.netflix.com/tudum/top10) TSV downloads (formerly top10.netflix.com): global weekly top 10 films and TV with hours viewed and views, the weekly US top 10 films and TV (filtered from Netflix's all-countries file), and the all-time most popular list, all back to July 2021. Netflix publishes weekly on Tuesdays, so each file is converted to CSV and saved only when it changes, dumps to S3 under `netflix-top-10/`."


  billboard-hot-100:
    script: billboard-hot-100.py
    workflow: job_1
    frequency: Daily
    timeout: 10
    timeout_note: one ~3 MB page; saves only when Billboard publishes a new weekly chart
    outputs:
      - stem: billboard-hot-100/billboard-hot-100-
        max_age_hours: 216
        note: one file per weekly chart (named by chart date), saved the Tuesday Billboard publishes it
    description: "Parses the [Billboard Hot 100](https://www.billboard.com/charts/hot-100/) from its chart page: rank, title, artist, last week's rank, peak, weeks at No. 1, weeks on chart, and a new / re-entry flag for all 100 songs. Billboard publishes weekly on Tuesdays (dated the following Saturday), so each chart is saved once, as CSV, dumps to S3 under `billboard-hot-100/`."

  mormon-reddit-comments:
    script: mormon-reddit-comments.py
    workflow: job_2
    frequency: Every 4 Hours
    timeout: 10
    secrets: [PRAW_CLIENT_ID, PRAW_CLIENT_SECRET, PRAW_USER_AGENT, PRAW_USERNAME, PRAW_PASSWORD]
    outputs:
      - mormon-reddit/mormon-reddit-comments-
    description: "Grabs the latest 250 comments per [\"mormon\"](https://www.reddit.com/r/mormon/) subreddit, dumps to S3."

  zillow-scrape:
    script: zillow-scrape.py
    workflow: job_3
    frequency: Daily
    timeout: 10
    timeout_note: a ~120 MB download when Zillow has published a new file
    outputs:
      - stem: zillow/zhvi-all-homes-zip-code-
        max_age_hours: 1200
        min_size_ratio: 0.8
        note: only saved when Zillow publishes a new file, about monthly
    description: "Scrapes [Zillow](https://www.zillow.com/research/data/)'s basic, zipcode-level ZHVF file, dumps to S3."

  tsa-passenger-volumes:
    script: tsa-passenger-volumes.py
    workflow: job_3
    frequency: Daily
    timeout: 10
    outputs:
      - tsa/tsa-passenger-volumes-
    description: "Scrapes daily passenger volume counts reported by the TSA, dumps to S3."

  mta-lift-status:
    script: mta-lift-status.py
