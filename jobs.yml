    timeout: 10
    outputs:
      - mta/metro-north-lifts/mta-mnr-lifts-
    description: "Scrapes elevator and escalator status logs from NY's Metro North Railroad, dumps to S3 under `mta/metro-north-lifts/`."

  nyrr-races:
    script: nyrr-races.py
