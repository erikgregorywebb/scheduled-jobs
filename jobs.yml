        min_size_ratio: null
        note: size swings with how many alerts are active
    description: "Snapshots Metro-North's [GTFS-realtime service alerts](https://api.mta.info/#/serviceAlerts): live delay and cancellation notices for individual trains (with train number and cause), planned work, schedule changes, and station notices, dumps to S3."

