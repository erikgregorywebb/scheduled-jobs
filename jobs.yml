# The one list of scheduled jobs. tools/manifest.py generates the job_*.yml
# workflows, job_test_python.yml and the README tables from it, and
# jobs/freshness-check.py reads it to spot jobs that stop saving files.
#
# After editing:   python tools/manifest.py          (rewrites the generated files)
# CI runs:         python tools/manifest.py --check  (fails if they're out of date)
#
# workflows: one GitHub Actions workflow each; jobs run one step after another.
#   cron / cron_note       schedule (UTC) and why
#   timeout / timeout_note whole-run limit in minutes
#
# jobs: one script each, in jobs/, in the order its workflow runs them.
#   script       file in jobs/
#   workflow     key under workflows
#   frequency    Hourly | Every 4 Hours | Daily (sets the default freshness limit:
#                4, 9 and 26 hours)
#   timeout      step limit in minutes (timeout_note: why, if not routine)
#   secrets      repository secrets the step needs besides the AWS keys
#   outputs      S3 key stems the job writes, i.e. the key up to its timestamp.
#                A stem may be a mapping with:
#                  max_age_hours   override the frequency's freshness limit
#                  min_size_ratio  flag a newest file smaller than this share of
#                                  the median of the previous 7 (default 0.5;
#                                  null turns the size check off)
#                  note            why
#   description  README text
#
# inactive: retired scripts kept in archive/, listed in the README.

workflows:
  job_1:
    description: Daily jobs.
    cron: '13 8 * * *'
    cron_note: daily at 08:13 UTC (off the top of the hour, when GitHub queues are busiest)
    timeout: 60
    timeout_note: a full run normally takes ~2 minutes
  job_2:
    description: Every-4-hours jobs.
    cron: '17 */4 * * *'
    cron_note: every 4 hours at :17 (00:17, 04:17, ... UTC), off the top of the hour
    timeout: 15
    timeout_note: normally under a minute; a hang can't overlap the next run
  job_3:
    description: Daily jobs (ported from R in 2026-11).
    cron: '29 8 * * *'
    cron_note: daily at 08:29 UTC (off the top of the hour, staggered after job_1)
    timeout: 45
  job_4:
    description: Daily Pinal County parcels scrape, the slowest job.
    cron: '43 8 * * *'
    cron_note: daily at 08:43 UTC (off the top of the hour, staggered after job_3)
    timeout: 45
    timeout_note: a run normally takes ~7 minutes
  job_5:
    description: Hourly jobs.
    cron: '7 * * * *'
    cron_note: hourly at :07 (off the top of the hour, when GitHub queues are busiest)
    timeout: 10
  job_6:
    description: Daily weather backfill, after the previous New York day has ended.
    cron: '23 6 * * *'
    cron_note: daily at 06:23 UTC (1:23/2:23 am Eastern)
    timeout: 10
  job_7:
    description: Daily Ski Utah snow reports. Utah resorts post their morning reports between about 5 and 7 am Mountain time, which none of the overnight workflows run after.
    cron: '37 14 * * *'
    cron_note: daily at 14:37 UTC (7:37 am MST / 8:37 am MDT)
    timeout: 15
  job_8:
    description: Daily freshness check of every job's S3 output, after the overnight daily jobs finish.
    cron: '47 11 * * *'
    cron_note: daily at 11:47 UTC, ~3 hours after the last overnight daily workflow starts
    timeout: 10

jobs:
  apple-app-store:
    script: apple-app-store.py
    workflow: job_1
    frequency: Daily
    timeout: 10
