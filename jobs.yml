      - travel-advisories/travel-advisories-
    description: "Collects the US State Department's [travel advisories](https://travel.state.gov/_res/rss/TAsTWs.xml) from its official RSS feed, dumps to S3."

  pinal-county-parcels:
    script: pinal-county-parcels.py
    workflow: job_4
    frequency: Daily
    timeout: 30
    timeout_note: normally ~7 minutes
    outputs:
      - pinal-county-parcels/gila-buttes-parcels-
    description: "Scrapes parcel details from the Pinal County, Arizona parcel search, dumps to S3."

  open-meteo-weather-hourly:
    script: open-meteo-weather-hourly.py
    workflow: job_5
    frequency: Hourly
    timeout: 4
    outputs:
      - weather/hourly/open-meteo-weather-hourly-
    description: "Collects current weather conditions for Scarsdale, NY from [Open-Meteo](https://open-meteo.com/), dumps to S3."

  citibike-station-status:
    script: citibike-station-status.py
    workflow: job_5
    frequency: Hourly
    timeout: 4
    outputs:
      - citibike/station-status/citibike-station-status-
    description: "Snapshots bikes and docks available at every Citi Bike station from the public [GBFS feed](https://gbfs.citibikenyc.com/gbfs/2.3/gbfs.json), with station name, location, and capacity, dumps to S3."

  faa-airport-status:
    script: faa-airport-status.py
    workflow: job_5
    frequency: Hourly
    timeout: 4
    outputs:
      - stem: faa-airport-status/faa-airport-status-
        min_size_ratio: null
        note: size swings with how many delays there are
    description: "Snapshots the FAA's live [airport status](https://nasstatus.faa.gov/) feed: ground stops, ground delay programs, arrival/departure delays, airspace flow programs, and closures, dumps to S3."

  metro-north-trip-updates:
    script: metro-north-trip-updates.py
    workflow: job_5
    frequency: Hourly
